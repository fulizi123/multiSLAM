%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

SequencePath: "/data/code/carla/20260114_1947_dataset"
# SequencePath: "/media/flag/T7/Carla_Dataset/0000"


SequenceBegin: 0
SequenceEnd: 100

SpeedUp: 0.5
##"distortion": [-0.3121, 0.1024, 0.00032953, -0.00039793, -0.0158]}
## Camera calibration and distortion parameters (OpenCV)
Camera.fx: 369.504172281
Camera.fy: 369.504172281
Camera.cx: 640.0
Camera.cy: 360.0

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.bFishEye: 0

Camera.width: 1280
Camera.height: 720

#Camera.imageScale: 0.3 # 0.5 #0.7071 # 1/sqrt(2)
#Camera.imageScale: 0.5 # 0.5 #0.7071 # 1/sqrt(2)
Camera.imageScale: 1.0 # 0.5 #0.7071 # 1/sqrt(2)

# Camera frames per second 
Camera.fps: 20.0

# stereo baseline times fx
Camera.bf: 752.941176471 #369.504172281 #

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
ThDepth: 40.0



#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
FeatureExtractor.FixFeatureNum: 1
FeatureExtractor.nFeatures: 1000
#FeatureExtractor.nFeatures: 800

# ORB Extractor: Scale factor between levels in the scale pyramid 	
FeatureExtractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
FeatureExtractor.nLevels: 1

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			

FeatureExtractor.iniThFAST: 20
FeatureExtractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.bUseViewer: 0 #1:true 0:false
Viewer.PathSacle: 0.05 #0.02 room 1 road
Viewer.KeyFrameSize: 0.6
Viewer.KeyFrameLineWidth: 2
Viewer.GraphLineWidth: 1
Viewer.PointSize: 2
Viewer.CameraSize: 0.7
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -100
Viewer.ViewpointZ: -0.1
Viewer.ViewpointF: 2000



